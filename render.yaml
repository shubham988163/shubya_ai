services:
  - type: web
    name: shubya-ai-trader
    env: python
    region: singapore
    plan: free
    branch: paper
    buildCommand: pip install -e .
    startCommand: python -u -m trading.dashboard
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: TZ
        value: Asia/Kolkata
